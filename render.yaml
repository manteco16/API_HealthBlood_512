services:
  - type: web
    name: healthblood-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /api/glucosa/saludar
    envVars:
      - key: DB_SSL_MODE
        value: DISABLED
      - key: JAVA_OPTS
        value: "-Xms64m -Xmx160m -XX:MaxMetaspaceSize=96m"
